<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Разум и Сердце</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=DotGothic16&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="./index.css" />
    <script type="module" src="./index.js"></script>
  </head>

  <body class="index">
    <!-- фон: разум слева, сердце справа -->
    <div class="backdrop" aria-hidden="true">
      <img class="art mind" src="./images/mind.svg" alt="" />
      <img class="art heart" src="./images/heart.svg" alt="" />
    </div>

    <div class="hint">
      В начале всё выключено: голоса и бит — кнопка ▶ (бит ещё Enter), эмоции —
      клик или клавиши A–J · кружок — нота вкл/выкл · бегунок — громкость ноты
    </div>

    <main class="sequencer">
      <section class="voice mind" id="mindSequencer"></section>
      <section class="voice heart" id="heartSequencer"></section>
    </main>

    <section class="block">
      <div class="sectionTitle">Эффекты</div>
      <div class="Effects" id="effects"></div>
    </section>

    <section class="block">
      <div class="sectionTitle">Эмоции</div>
      <div class="Pads" id="pads"></div>
    </section>

    <section class="block">
      <div class="sectionTitle">Бит</div>
      <div class="beatCards">
        <div class="beatCard transport">
          <div class="ToggleButton PlayButton beatToggle" id="beatToggle" role="button"></div>
          <div class="ToggleButtonSet" id="beatPresets"></div>
        </div>

        <div class="beatCard Slider tempo">
          <div class="title">
            Темп
            <span class="value"><span id="beatTempoValue"></span> BPM</span>
          </div>
          <input id="beatTempo" type="range" step="1" />
        </div>

        <div class="beatCard Slider beatVolume">
          <div class="title">
            Бит
            <span class="value"><span id="beatVolumeValue"></span> дБ</span>
          </div>
          <input id="beatVolume" type="range" step="1" />
        </div>
      </div>
    </section>
  </body>
</html>
